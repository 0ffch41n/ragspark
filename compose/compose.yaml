# RAGSpark - single mode on one DGX Spark.
#
# Run every command from this directory: .env (created by init-env.sh) sets
# COMPOSE_FILE, which adds the LLM file from llm/ to this one.
#
#   ./init-env.sh                                   once: secrets, time zone
#   sudo docker compose up -d --wait --wait-timeout 2400
#   sudo docker compose ps
#   sudo docker compose down                        stop; data is kept
#
# Start order (enforced with health checks):
#   vllm-embed -> vllm-rerank -> vllm-llm   one at a time, see docs/COMPOSE.md
#   es01, mysql, minio, redis               in parallel with the models
#   ragflow                                 last, when everything above is healthy
#
# Only the web entry (RAGFlow's nginx) is published. Everything else is
# reachable on the internal network or through `docker compose exec`.
#
# Images are pinned by digest: tools/pin_images.py records the digest of the
# local image for each tag.
#
# Variables read here start with RAGSPARK_ where a shell might define the
# plain name too (TZ): compose prefers the shell's value over .env.

name: ragspark

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Docker's on-failure policy restarts a crashed container but does not start
# containers when the host boots: the start order above only holds when
# compose starts the stack. The installer (stage 3.3) adds a systemd unit.
x-restart: &restart
  restart: on-failure:5

x-vllm: &vllm
  <<: *restart
  logging: *logging
  entrypoint: ["/usr/bin/env"]
  ipc: host
  environment:
    HF_HUB_OFFLINE: ${RAGSPARK_HF_OFFLINE:-1}   # weights come from the host cache only
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_NO_USAGE_STATS: "1"
    DO_NOT_TRACK: "1"
    TZ: ${RAGSPARK_TZ:-Etc/UTC}
  volumes:
    - ${RAGSPARK_HF_CACHE:-/srv/ragspark/hf-cache}:/root/.cache/huggingface
    - vllm-compile-cache:/root/.cache/vllm      # torch.compile results, keyed by vLLM version and flags
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    interval: 20s
    timeout: 10s
    retries: 3
    start_period: 10m

services:

  # ---------------------------------------------------------------- models
  # Memory shares are fractions of the whole unified memory (121 GiB).

  vllm-embed:
    <<: *vllm
    image: vllm/vllm-openai:v0.27.1-aarch64@sha256:1c8e60a0841b333c700488cb029d3664807249da0c071e862191b00fe34b228c
    command:
      - vllm
      - serve
      - deepvk/USER-bge-m3
      - --runner
      - pooling
      - --gpu-memory-utilization
      - "0.05"
      - --trust-remote-code

  vllm-rerank:
    <<: *vllm
    image: vllm/vllm-openai:v0.27.1-aarch64@sha256:1c8e60a0841b333c700488cb029d3664807249da0c071e862191b00fe34b228c
    command:
      - vllm
      - serve
      - BAAI/bge-reranker-v2-m3
      - --runner
      - pooling
      - --gpu-memory-utilization
      - "0.03"
      - --trust-remote-code
    depends_on:
      vllm-embed:
        condition: service_healthy

  # The image and command come from the LLM file selected in .env (llm/*.yaml).
  vllm-llm:
    <<: *vllm
    depends_on:
      vllm-rerank:
        condition: service_healthy

  # ------------------------------------------------------- infrastructure
  # Versions as in RAGFlow 0.27.2's own compose.

  es01:
    <<: *restart
    image: elasticsearch:8.11.3@sha256:58a3a280935d830215802322e9a0373faaacdfd646477aa7e718939c2f29292a
    logging: *logging
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?run init-env.sh}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${RAGSPARK_TZ:-Etc/UTC}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m       # the image's /tmp is not writable for its user
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 120

  mysql:
    <<: *restart
    image: mysql:8.0.40@sha256:d58ac93387f644e4e040c636b8f50494e78e5afc27ca0a87348b2f577da2b7ff
    logging: *logging
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?run init-env.sh}
      - MYSQL_DATABASE=${MYSQL_DBNAME:-rag_flow}
      - TZ=${RAGSPARK_TZ:-Etc/UTC}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
    volumes:
      - mysql:/var/lib/mysql
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot"]
      interval: 10s
      timeout: 10s
      retries: 120

  minio:
    <<: *restart
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    logging: *logging
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-rag_flow}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?run init-env.sh}
      - TZ=${RAGSPARK_TZ:-Etc/UTC}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120

  redis:
    <<: *restart
    image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run init-env.sh}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      - VALKEYCLI_AUTH=${REDIS_PASSWORD}  # password for the health check's redis-cli
      - REDISCLI_AUTH=${REDIS_PASSWORD}   # (older name, same purpose)
      - TZ=${RAGSPARK_TZ:-Etc/UTC}
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 120

  # ---------------------------------------------------------------- RAGFlow

  ragflow:
    <<: *restart
    image: ghcr.io/0ffch41n/ragspark-ragflow:0.27.2-arm64-r2@sha256:4232ddbb513cff48c51864f081f6b82d37371927dea70bb01a200c6994f70dcc
    logging: *logging
    hostname: ragflow                  # stable task-executor id across re-creation
    command:                           # as in RAGFlow 0.27.2's compose
      - --enable-adminserver
      - --init-model-provider-tables
    env_file: .env
    environment:
      TZ: ${RAGSPARK_TZ:-Etc/UTC}
    ports:
      - "${RAGSPARK_HTTP_BIND:-0.0.0.0}:${RAGSPARK_HTTP_PORT:-80}:80"
    volumes:
      - ragflow-logs:/ragflow/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm-embed:
        condition: service_healthy
      vllm-rerank:
        condition: service_healthy
      vllm-llm:
        condition: service_healthy
    healthcheck:
      # nginx -> API -> MySQL, Valkey, Elasticsearch and object storage
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/api/v1/system/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 5m

volumes:
  vllm-compile-cache:
  esdata:
  mysql:
  minio:
  valkey:
  ragflow-logs:

networks:
  default:
    name: ragspark
