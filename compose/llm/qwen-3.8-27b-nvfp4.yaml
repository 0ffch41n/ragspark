# LLM: Qwen 3.8 27B NVFP4 with multi-token prediction (catalog id qwen-3.8-27b-nvfp4).
# Selected in .env:  COMPOSE_FILE=compose.yaml:llm/qwen-3.8-27b-nvfp4.yaml
#
# Flags and measurements: catalog/models.yaml, docs/VALIDATION.md section 1.

services:
  vllm-llm:
    image: vllm/vllm-openai:v0.27.1-aarch64@sha256:1c8e60a0841b333c700488cb029d3664807249da0c071e862191b00fe34b228c
    command:
      - vllm
      - serve
      - Inferact/Qwen3.8-27B-NVFP4
      - --served-model-name
      - qwen3.8-27b
      - --gpu-memory-utilization
      - "0.50"
      - --max-model-len
      - "65536"
      - --max-num-batched-tokens
      - "8192"                          # MTP otherwise caps the batch at 2048 tokens
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'    # RAGFlow does not send it; thinking costs ~10x time
      - --override-generation-config
      - '{"temperature": 0.7, "top_p": 0.8, "top_k": 20}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30m                 # ~7 min with cached weights (MTP + CUDA graphs)

  # What tools/ragflow_models.py registers in RAGFlow for this LLM.
  ragflow:
    environment:
      RAGSPARK_LLM_NAME: qwen3.8-27b
      RAGSPARK_LLM_CONTEXT: "65536"
      RAGSPARK_LLM_TOOLS: "1"
