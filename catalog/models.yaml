# RAGSpark model catalog, schema 1
#
# Runnable entries point to a compose file (`compose:`). That file is the
# source of truth for the image, its digest, the weights revision (`--revision`,
# a commit of the Hugging Face repository) and the vLLM flags; the catalog
# keeps what the installer shows and what was measured. Candidates without a
# compose file record what is known so far.
#
# The installer reads this file (installer/rsinst/catalog.py): its LLM menu
# lists the runnable entries that support the mode being installed, with
# speed, context, memory, license and status; `install --llm list` prints it.
#
# Field meanings:
#   serving_verified  vLLM served this model on real DGX Spark hardware with
#                     exactly this image and these flags (facts recorded below)
#   validated         passed the RAGSpark acceptance test (document upload ->
#                     question -> cited answer) on real hardware; the installer
#                     shows true as "validated", false as "experimental"
#   license           checked on the model card at the pinned revision; the
#                     part before " (" is shown in the menu and in the install
#                     plan, before anything is downloaded
#   summary           one line per language for the installer's menu
#                     (runnable entries)
#   modes             single: one DGX Spark; stack: two units on a direct QSFP
#                     cable (D10), the LLM split across both (nodes: 2)
#
# Every image is pinned by digest. Never use floating tags in a release.

schema: 1

hardware:
  dgx-spark:
    arch: arm64
    gpu: GB10
    cuda_sm: "12.1"
    usable_memory_gib: 121      # unified CPU+GPU memory as reported by the OS
    driver_branch: "580"        # newer branches regress on GB10

# Images used by compose/: vllm/vllm-openai:v0.27.1-aarch64 (vLLM 0.27.1,
# CUDA 13.0; reports compute capability (12, 1) on GB10 and selects
# FlashInferCutlassNvFp4LinearKernel for NVFP4); for DeepSeek V4 in stack mode
# ghcr.io/timothystewart6/vllm-gb10:v0.31.0-gb10.1 (vLLM 0.31.0 built for
# sm_121a, CUDA 13.2, FlashInfer 0.7.0.post1, b12x 1.5.0; a community build,
# D20). Digests are in compose/.

models:
  llm:
    - id: gemma-4-26b-a4b
      hf_repo: google/gemma-4-26B-A4B-it
      served_name: google/gemma-4-26B-A4B-it
      modes: [single]
      compose: null                     # no LLM file: set aside in stage 4 (note)
      image: vllm/vllm-openai:gemma4-cu130@sha256:0d152595cd940ea1e0890fa190a37b7a86e3f7f0f5048ac3e2e4c14529fea833
      gpu_memory_utilization: 0.60      # ~84 GB: ~50 GB weights + KV cache
      context:
        default: 65536
      vllm_args: [--kv-cache-dtype, fp8, --enable-prefix-caching, --enforce-eager]
      tool_calling: false               # no tool-call parser configured
      serving_verified: "2026-09-30 DGX OS 7.5.0, driver 580.178.04, CUDA 13.0 (image built for Gemma 4, vLLM 0.19)"
      measured:
        decode_tok_s_single: 23
      validated: false
      license: TBD
      note: >-
        Set aside in stage 4: without tool calling it serves only the Naive
        level, and it is slower than both runnable LLMs (23 tok/s against
        27 and 108).

    - id: qwen-3.8-27b-nvfp4
      hf_repo: unsloth/Qwen3.8-27B-NVFP4    # FP8 where Inferact's checkpoint keeps bf16: faster, same MTP acceptance (D16)
      served_name: qwen3.8-27b
      modes: [single]
      compose: compose/llm/qwen-3.8-27b-nvfp4.yaml   # image, flags: MTP 3, thinking off, fp8 KV cache
      memory_share: 0.50                # of unified memory; weights ~22 GiB, the rest KV cache (~770k tokens)
      context:
        default: 65536
      tool_calling: true
      vision: true                      # vision tower in the checkpoint, vLLM serves images; parses scans as ragspark-vision (D14)
      serving_verified: "2026-10-28 DGX OS 7.6.0, driver 580.178.04, CUDA 13.0"
      measured:                         # VALIDATION section 12; Inferact's checkpoint in parentheses
        decode_tok_s_single: 27.2       # MTP 3, 1k context (21.1); 26.0 at 8k (21.3), first token at 8k 6.4 s (4.9)
        concurrency_8: "all OK, ~137 tok/s aggregate (127)"
        startup_min: 7                  # weights cached; MTP + CUDA graph capture; 5.5 with the compile cache
        language_mixing: "0 of 30 probe answers (Inferact's checkpoint: 1 of 30)"
      validated: true                   # acceptance test 2026-10-23; sample 7/7 at every chat level on the running stack 2026-10-28 (VALIDATION section 12)
      license: "Apache-2.0 (checkpoint card and base model Qwen/Qwen3.8-27B, checked 2026-10-28)"
      summary:
        en: The best answers at every chat level.
        ru: Лучшие ответы на всех уровнях чата.
      note: >-
        min_p and logit_bias are ignored with speculative decoding.
        Add "Answer only in Russian" to the assistant prompt as a safeguard.

    - id: qwen-3.6-35b-a3b-nvfp4
      hf_repo: unsloth/Qwen3.6-35B-A3B-NVFP4-Fast   # MoE 35B, 3B active; NVFP4 experts, FP8 attention and lm_head
      served_name: qwen3.6-35b-a3b
      modes: [single]
      compose: compose/llm/qwen-3.6-35b-a3b-nvfp4.yaml   # image, flags: b12x MoE kernels, MTP 3, thinking off, fp8 KV cache
      memory_share: 0.50                # of unified memory; weights ~22 GiB, the rest KV cache (~1.4M tokens)
      context:
        default: 65536
      tool_calling: true
      vision: true                      # vision tower in the checkpoint; parses scans as ragspark-vision (D14)
      serving_verified: "2026-10-29 DGX OS 7.6.0, driver 580.178.04, CUDA 13.0"
      measured:                         # 2026-10-29, same harness and RAGFlow sample as the default LLM; its numbers in parentheses
        decode_tok_s_single: 107.6      # MTP 3, 1k context (27.2); 102.8 at 8k (26.0), first token at 8k 1.4 s (6.4)
        concurrency_8: "all OK, ~366 tok/s aggregate (137)"
        startup_min: 7                  # weights cached; MTP + CUDA graph capture
        language_mixing: "0 of 30 probe answers"
        chat_levels: "Naive 7/7, Low 7/7, Medium 6/7, High 6/7, Ultra 5/7 (7/7 at every level); no-answer question 1/1 at every level"
        scan_4_pages_s: 27              # via ragspark-vision, Cyrillic share 0.885, 0 garbled words (85)
      validated: true                   # acceptance test, sample at every chat level and the MSI manual through RAGFlow 2026-10-29
      license: "Apache-2.0 (checkpoint card and base model Qwen/Qwen3.6-35B-A3B, checked 2026-10-29)"
      summary:
        en: About 4x faster; at Medium and above more often answers only in part.
        ru: Примерно в 4 раза быстрее; на уровнях Medium и выше чаще отвечает неполно.
      note: >-
        The fast choice: about 4x the default LLM's speed, same answers in
        Naive and Low (the default chat level). At Medium and above it more
        often gives only part of a two-part answer.
        CUTE_DSL_ARCH=sm_121a and --moe-backend flashinfer_b12x are required
        for its speed; the MTP drafter keeps moe_backend auto.

    - id: deepseek-v4-flash-vision
      hf_repo: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp   # 284B MoE, 13B active; FP8 + FP4 experts, vision tower, DSpark draft
      served_name: deepseek-v4-flash
      modes: [stack]
      nodes: 2
      compose: compose/llm/deepseek-v4-flash-vision.yaml  # the head's half; the node's: compose/node/llm/, flags: compose/ranks/
      memory_gib_per_node: 92           # weights 79.5 GiB + KV cache 12 GiB (233k tokens, 3.5 requests of 64k)
      context:
        default: 65536
      tool_calling: true
      vision: true                      # 1536 tokens a page (hf override; the model's default 384 loses small print)
      serving_verified: "2026-11-11 DGX OS 7.6.0, driver 580.178.04, CUDA 13.2, two units on QSFP (tensor parallel 2)"
      measured:                         # 2026-11-11, VALIDATION section 17, same harness as the default LLM; its numbers in parentheses
        decode_tok_s_single: 55.4       # DSpark 3, 1k context (27.2); 58.7 at 8k (26.0), first token at 8k 3.0 s (6.4)
        concurrency_8: "all OK, ~204 tok/s aggregate (137)"
        startup_min: 8                  # first start 8.5, then ~6 with the kernel cache; weights read with the default loader
        language_mixing: "0 of 30 probe answers"
        chat_levels: "7/7 at every level, no-answer question 1/1 at every level (the same)"
        scan_4_pages_s: 49              # 1536 tokens: words 99.6%, numbers 100% (27B: the same, 88 s); a dense page 98.9% / 98.1% (99.8% / 100%)
        knowledge_cutoff: "about May 2025, by its own answers"
      validated: false                  # passed the acceptance test and every chat level in the stage 5 window; true after the stack install (stage 5.4)
      license: "MIT (model card and LICENSE at the pinned revision, checked 2026-11-10)"
      summary:
        en: Two DGX Sparks - about 2x the default's speed, a 284B model; same answers on the samples.
        ru: Два DGX Spark - примерно вдвое быстрее основной, модель на 284B; на тестовых наборах отвечает так же.
      note: >-
        Needs both units and the cable: when the node is down, the web interface
        and documents stay up but answers fail until `ragspark llm` switches to
        a single-mode LLM. Its knowledge ends around May 2025.

    - id: nemotron-3-super-120b-a12b-nvfp4
      hf_repo: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
      modes: [single]
      image: TBD                        # upstream recipe uses vllm/vllm-openai:cu130-nightly; pin a digest
      context:
        default: 131072
      vllm_args: [--reasoning-parser, nemotron_v3, --enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
      serving_verified: false
      validated: false
      license: TBD
      note: >-
        candidate for the 120B class. The upstream recipe uses
        gpu_memory_utilization 0.85, which leaves too little memory for
        RAGFlow, embeddings and reranker - must be tuned down.

    - id: gpt-oss-120b
      hf_repo: openai/gpt-oss-120b
      modes: [single, stack]
      image: TBD
      serving_verified: false
      validated: false
      license: TBD
      note: candidate for the 120B class; MXFP4 weights

  embedding:
    - id: user-bge-m3
      hf_repo: deepvk/USER-bge-m3
      compose: compose/compose.yaml     # service vllm-embed
      memory_share: 0.05
      context: 8192
      memory_gb: 2
      serving_verified: "2026-10-07 on vllm/vllm-openai:v0.27.1-aarch64 (also 2026-09-30 on :gemma4-cu130)"
      validated: true                   # in every acceptance test since stage 3: clean install 2026-10-20 (VALIDATION section 9), stage 4 2026-11-09 (section 15)
      license: "Apache-2.0 (model card at the pinned revision, checked 2026-11-09)"

  rerank:
    - id: bge-reranker-v2-m3
      hf_repo: BAAI/bge-reranker-v2-m3
      compose: compose/compose.yaml     # service vllm-rerank
      memory_share: 0.03
      context: 8192
      memory_gb: 2
      serving_verified: "2026-10-07 on vllm/vllm-openai:v0.27.1-aarch64 (also 2026-09-30 on :gemma4-cu130)"
      validated: true                   # in every acceptance test since stage 3: clean install 2026-10-20 (VALIDATION section 9), stage 4 2026-11-09 (section 15)
      license: "Apache-2.0 (model card at the pinned revision, checked 2026-11-09)"
      note: >-
        Absolute scores are low for long, noisy chunks; RAGSpark uses
        threshold 0.1 with vector weight 0.7 (see docs/VALIDATION.md).

defaults:
  llm: qwen-3.8-27b-nvfp4
  embedding: user-bge-m3
  rerank: bge-reranker-v2-m3
